name: OMNI QR DEMO sales cycle validation

on:
  push:
    branches: ["feat/omni-order-qr-full-demo-cycle-1.4.5"]
    paths:
      - "app/src/main/java/com/example/ui/screens/OrderCenterScreen.kt"
      - "app/src/main/java/com/example/data/wallet/DemoWalletRepository.kt"
      - "admin/**"
      - "functions/**"
      - ".github/workflows/omni-order-admin-compile.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Compile Admin and validate Admin API types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Create temporary Firebase compile configuration
        run: |
          mkdir -p admin
          cat > admin/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "omni-admin-compile-check",
              "storage_bucket": "omni-admin-compile-check.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:1234567890abcdef",
                "android_client_info": { "package_name": "com.omni.adminpanel" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyDUMMYCOMPILECHECKKEY000000000000000" }],
              "services": {}
            }],
            "configuration_version": "1"
          }
          JSON
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=OMNI Compile Check,O=OMNI,C=AR" -keyalg RSA -keysize 2048 -validity 2
      - name: Compile OMNI Admin source (not published)
        run: gradle :admin:assembleDebug
      - name: Install Admin API dependencies
        run: npm install --prefix functions --no-package-lock
      - name: Validate Admin API TypeScript
        run: npm run lint --prefix functions
