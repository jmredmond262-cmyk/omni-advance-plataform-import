name: Build OMNI DEMO Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - feat/omni-demo-online-isolated-complete

permissions:
  contents: read

jobs:
  build-demo:
    name: Build isolated Principal and Admin DEMO APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Configure isolated Firebase apps and Worker endpoint
        env:
          PRINCIPAL_DEMO_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          ADMIN_DEMO_JSON: ${{ secrets.OMNI_ADMIN_GOOGLE_SERVICES_JSON_BASE64 }}
          DEMO_WORKER_URL: ${{ secrets.OMNI_DEMO_WORKER_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$PRINCIPAL_DEMO_JSON" || { echo "::error::Falta OMNI_DEMO_GOOGLE_SERVICES_JSON_BASE64"; exit 1; }
          test -n "$ADMIN_DEMO_JSON" || { echo "::error::Falta OMNI_ADMIN_DEMO_GOOGLE_SERVICES_JSON_BASE64"; exit 1; }
          [[ "$DEMO_WORKER_URL" == https://* ]] || { echo "::error::OMNI_DEMO_WORKER_BASE_URL debe ser HTTPS"; exit 1; }
          mkdir -p app/src/demo admin/src/demo/res/values
          if [ -f "app/src/demo/google-services.json" ]; then
            echo "Usando google-services.json actualizado del repositorio con SHA-1 OAuth."
          else
            printf '%s' "$PRINCIPAL_DEMO_JSON" | base64 --decode > app/src/demo/google-services.json
          fi
          printf '%s' "$ADMIN_DEMO_JSON" | base64 --decode > admin/src/demo/google-services.json
          python3 - <<'PY'
          import json, os, sys, xml.sax.saxutils as xml
          with open("app/src/demo/google-services.json", encoding="utf-8") as f:
              principal = json.load(f)
          if principal["project_info"]["project_id"] != "omni-demo-33675":
              raise SystemExit("El google-services de Principal no corresponde al Firebase DEMO.")
          p = next((x for x in principal["client"] if x["client_info"]["android_client_info"]["package_name"] == "com.aistudio.omnihub.qtzmvd.demo"), None)
          if p is None:
              raise SystemExit("Firebase DEMO no tiene registrada la app Android com.aistudio.omnihub.qtzmvd.demo.")
          with open("admin/src/demo/google-services.json", encoding="utf-8") as f:
              admin = json.load(f)
          if admin["project_info"]["project_id"] != "omni-admin-52e3f":
              raise SystemExit("El google-services de Admin DEMO no corresponde al proyecto de autenticación administrativa.")
          a = next((x for x in admin["client"] if x["client_info"]["android_client_info"]["package_name"] == "com.omni.adminpanel.demo"), None)
          if a is None:
              raise SystemExit("El proyecto Admin Auth no tiene registrada la app com.omni.adminpanel.demo.")
          project = admin["project_info"]
          values = {
              "google_app_id": a["client_info"]["mobilesdk_app_id"],
              "google_api_key": a["api_key"][0]["current_key"],
              "project_id": project["project_id"],
              "gcm_defaultSenderId": project["project_number"],
              "google_storage_bucket": project.get("storage_bucket", ""),
          }
          web_client = next((oauth["client_id"] for item in admin["client"] for oauth in item.get("oauth_client", []) if oauth.get("client_type") == 3), None)
          if web_client:
              values["default_web_client_id"] = web_client
          with open("admin/src/demo/res/values/firebase_config.xml", "w", encoding="utf-8") as f:
              f.write("<resources>\n")
              for key, value in values.items():
                  f.write(f'  <string name="{key}" translatable="false">{xml.escape(value)}</string>\n')
              f.write("</resources>\n")
          PY
          echo "OMNI_DEMO_WORKER_BASE_URL=$DEMO_WORKER_URL" >> "$GITHUB_ENV"

      - name: Configure persistent OMNI signing identity
        env:
          OMNI_DEBUG_KEYSTORE_BASE64: ${{ secrets.OMNI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$OMNI_DEBUG_KEYSTORE_BASE64" || { echo "::error::Falta OMNI_DEBUG_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$OMNI_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          EXPECTED_SHA256="486513DCA524F8C09134DB97A7D5650A2F2461E4306DB181B7C2DFE2D40E495B"
          ACTUAL_SHA256="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || { echo "::error::La firma persistente de OMNI no coincide."; exit 1; }
          echo "Firma persistente validada."

      - name: Validate Google Sign-In OAuth for the exact DEMO package and signing certificate
        run: |
          set -euo pipefail
          SIGNING_SHA1="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | awk '/SHA1:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$SIGNING_SHA1" || { echo "::error::No se pudo obtener el SHA-1 de la firma persistente."; exit 1; }
          export SIGNING_SHA1
          python3 - <<'PY' || true
          import json, os
          path = "app/src/demo/google-services.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          package = "com.aistudio.omnihub.qtzmvd.demo"
          client = next((x for x in data.get("client", []) if x.get("client_info", {}).get("android_client_info", {}).get("package_name") == package), None)
          if client is None:
              print(f"::warning::Falta el registro Android exacto {package} en Firebase DEMO.")
          else:
              sha1 = os.environ["SIGNING_SHA1"].upper()
              android_oauth = [x for x in client.get("oauth_client", []) if x.get("client_type") == 1]
              matching = [x for x in android_oauth if x.get("android_info", {}).get("package_name") == package and x.get("android_info", {}).get("certificate_hash", "").replace(":", "").upper() == sha1]
              if not matching:
                  found = [f"{x.get('android_info', {}).get('package_name', '?')} / {x.get('android_info', {}).get('certificate_hash', '?')}" for x in android_oauth]
                  print("::warning::Firebase DEMO SHA-1 warning: SHA-1 actual " + sha1 + ". Registrados: " + (", ".join(found) or "ninguno"))
              else:
                  print("Google Sign-In DEMO validado con éxito.")
          PY

      - name: Configure optional API keys for free DEMO mode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          GEMINI_VALUE="${GEMINI_API_KEY:-NOT_CONFIGURED}"
          MAPS_VALUE="${GOOGLE_MAPS_API_KEY:-NOT_CONFIGURED}"
          printf 'GEMINI_API_KEY=%s\nGOOGLE_MAPS_API_KEY=%s\n' "$GEMINI_VALUE" "$MAPS_VALUE" > .env
          echo "Claves opcionales configuradas; DEMO puede compilar sin servicios pagos."

      - name: Build Principal and Admin DEMO variants
        env:
          OMNI_VERSION_CODE: ${{ github.run_number }}
          OMNI_ADMIN_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleDemo :admin:assembleDemo

      - name: Upload APKs as GitHub Artifacts (Always reliable)
        uses: actions/upload-artifact@v4
        with:
          name: omni-demo-apks
          path: |
            app/build/outputs/apk/demo/app-demo.apk
            admin/build/outputs/apk/demo/admin-demo.apk

      - name: Upload DEMO APKs to GoFile
        id: gofile
        env:
          GOFILE_UPLOAD_URL: https://upload.gofile.is/uploadfile
        run: |
          set -euo pipefail
          PRINCIPAL_APK="app/build/outputs/apk/demo/app-demo.apk"
          ADMIN_APK="admin/build/outputs/apk/demo/admin-demo.apk"
          test -s "$PRINCIPAL_APK"
          test -s "$ADMIN_APK"

          upload_response="$(curl --retry 3 --retry-delay 2 --fail-with-body --silent --show-error \
            -F "file=@$PRINCIPAL_APK" "$GOFILE_UPLOAD_URL")"
          upload_status="$(jq -r '.status // empty' <<< "$upload_response")"
          test "$upload_status" = "ok" || {
            echo "::error::GoFile rechazó la subida del APK Principal."
            jq -r '.message // .status // "Respuesta no válida"' <<< "$upload_response"
            exit 1
          }
          guest_token="$(jq -r '.data.guestToken // empty' <<< "$upload_response")"
          folder_id="$(jq -r '.data.parentFolder // .data.folderId // empty' <<< "$upload_response")"
          principal_url="$(jq -r '.data.downloadPage // empty' <<< "$upload_response")"
          test -n "$guest_token" && test -n "$folder_id" && test -n "$principal_url" || {
            echo "::error::GoFile no devolvió los datos necesarios para continuar la sesión guest."
            exit 1
          }
          unset upload_response

          admin_response="$(curl --retry 3 --retry-delay 2 --fail-with-body --silent --show-error \
            -F "file=@$ADMIN_APK" \
            -F "token=$guest_token" \
            -F "folderId=$folder_id" "$GOFILE_UPLOAD_URL")"
          admin_status="$(jq -r '.status // empty' <<< "$admin_response")"
          test "$admin_status" = "ok" || {
            echo "::error::GoFile rechazó la subida del APK Admin."
            jq -r '.message // .status // "Respuesta no válida"' <<< "$admin_response"
            exit 1
          }
          admin_url="$(jq -r '.data.downloadPage // empty' <<< "$admin_response")"
          test -n "$admin_url" || {
            echo "::error::GoFile no devolvió el enlace de descarga del APK Admin."
            exit 1
          }
          unset admin_response guest_token

          {
            echo "## APK DEMO de OMNI"
            echo ""
            echo "| Aplicación | Descarga |"
            echo "|---|---|"
            echo "| OMNI Principal | [Descargar APK]($principal_url) |"
            echo "| OMNI Admin | [Descargar APK]($admin_url) |"
            echo ""
            echo "Los APK se generaron en esta ejecución y se alojaron externamente en GoFile."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "OMNI_PRINCIPAL_DEMO_APK_URL=$principal_url"
          echo "OMNI_ADMIN_DEMO_APK_URL=$admin_url"
