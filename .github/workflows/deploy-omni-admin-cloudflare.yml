name: Deploy OMNI Admin API to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - fix/stage-1-firestore-rules
    paths:
      - workers/src/index.js

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy secure OMNI Admin API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected workflow branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.OMNI_PRIMARY_FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          ADMIN_AUTH_PROJECT_ID: ${{ secrets.OMNI_ADMIN_AUTH_PROJECT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::Falta OMNI_PRIMARY_FIREBASE_SERVICE_ACCOUNT_BASE64"; exit 1; }
          test -n "$ADMIN_AUTH_PROJECT_ID" || { echo "::error::Falta OMNI_ADMIN_AUTH_PROJECT_ID"; exit 1; }
          grep -Fq "const ADMIN_AUTH_PROJECT = \"$ADMIN_AUTH_PROJECT_ID\";" workers/src/index.js || { echo "::error::El Worker y el proyecto de autenticación administrativa no coinciden."; exit 1; }
          echo "Credenciales y proyecto de autenticación administrativa validados."

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config workers/wrangler.toml

      - name: Set primary Firebase service credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERVICE_ACCOUNT_BASE64: ${{ secrets.OMNI_PRIMARY_FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_BASE64" | base64 --decode | wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON --name omni-admin-api --config workers/wrangler.toml

