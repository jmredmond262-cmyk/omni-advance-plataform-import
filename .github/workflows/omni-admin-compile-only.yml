name: OMNI Admin · compile-only validation

on:
  push:
    branches:
      - feature/omni-admin-live-map-1.4.3-correct-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-android:
    name: Compile Admin Kotlin without Firebase credentials or signing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Create temporary compile-only Firebase configuration
        run: |
          mkdir -p admin
          cat > admin/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "omni-admin-compile-check",
              "storage_bucket": "omni-admin-compile-check.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:1234567890abcdef",
                "android_client_info": { "package_name": "com.omni.adminpanel" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyDUMMYCOMPILECHECKKEY000000000000000" }],
              "services": {}
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Compile Admin Kotlin sources
        run: gradle :admin:compileDebugKotlin --no-daemon

  worker:
    name: Validate Worker JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Worker syntax without contacting Firebase
        run: node --check workers/src/index.js
