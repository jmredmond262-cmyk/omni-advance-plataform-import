name: OMNI Admin 1.4.3 - Mapa en tiempo real

on:
  push:
    branches: ["feature/omni-admin-live-map-1.4.3"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build and verify OMNI Admin 1.4.3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Install dedicated Admin Firebase configuration
        env:
          ADMIN_FIREBASE_JSON: ${{ secrets.OMNI_ADMIN_GOOGLE_SERVICES_JSON_BASE64 }}
          ADMIN_AUTH_PROJECT_ID: ${{ secrets.OMNI_ADMIN_AUTH_PROJECT_ID }}
        run: |
          test -n "$ADMIN_FIREBASE_JSON" || { echo "::error::Falta OMNI_ADMIN_GOOGLE_SERVICES_JSON_BASE64"; exit 1; }
          printf '%s' "$ADMIN_FIREBASE_JSON" | base64 --decode > admin/google-services.json
          python3 - <<'PY'
          import json, os
          with open("admin/google-services.json", encoding="utf-8") as f:
              cfg = json.load(f)
          project = cfg["project_info"]["project_id"]
          packages = [c["client_info"]["android_client_info"]["package_name"] for c in cfg["client"]]
          expected_project = os.environ.get("ADMIN_AUTH_PROJECT_ID", "").strip()
          if expected_project and project != expected_project:
              raise SystemExit("El proyecto Firebase de Admin no coincide con OMNI_ADMIN_AUTH_PROJECT_ID.")
          if "com.omni.adminpanel" not in packages:
              raise SystemExit("Firebase no contiene la app Android com.omni.adminpanel.")
          print("Configuración Firebase Admin validada.")
          PY
      - name: Configure persistent OMNI signing identity
        env:
          OMNI_DEBUG_KEYSTORE_BASE64: ${{ secrets.OMNI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$OMNI_DEBUG_KEYSTORE_BASE64" || { echo "::error::Falta OMNI_DEBUG_KEYSTORE_BASE64. Se cancela para proteger las actualizaciones existentes."; exit 1; }
          printf '%s' "$OMNI_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          EXPECTED_SHA256="486513DCA524F8C09134DB97A7D5650A2F2461E4306DB181B7C2DFE2D40E495B"
          ACTUAL_SHA256="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || { echo "::error::La firma no coincide con la identidad persistente de OMNI Admin."; exit 1; }
          echo "Firma persistente validada."
      - name: Build standalone Admin APK
        env:
          OMNI_ADMIN_VERSION_CODE: ${{ github.run_number }}
        run: gradle :admin:assembleDebug
      - name: Verify package, version and signing identity
        run: |
          APK="admin/build/outputs/apk/debug/admin-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "name='com.omni.adminpanel' versionCode='$GITHUB_RUN_NUMBER' versionName='1.4.3'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > /tmp/admin-apk-certs.txt
          APK_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' /tmp/admin-apk-certs.txt | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA256="486513DCA524F8C09134DB97A7D5650A2F2461E4306DB181B7C2DFE2D40E495B"
          test "$APK_SHA256" = "$EXPECTED_SHA256" || { echo "::error::La APK no conserva la firma autorizada."; cat /tmp/admin-apk-certs.txt; exit 1; }
          echo "APK OMNI Admin 1.4.3 verificada."
      - name: Upload OMNI Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: omni-admin-live-map-1.4.3-apk
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
          retention-days: 90
