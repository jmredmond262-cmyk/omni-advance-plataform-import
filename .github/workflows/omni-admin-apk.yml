name: OMNI Admin · APK instalable

on:
  push:
    branches:
      - feature/omni-admin-live-map-1.4.3-correct-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify OMNI Admin APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Admin branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Configure OMNI Admin Firebase
        env:
          ADMIN_FIREBASE_JSON_BASE64: ${{ secrets.OMNI_ADMIN_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$ADMIN_FIREBASE_JSON_BASE64" || { echo "::error::Falta OMNI_ADMIN_GOOGLE_SERVICES_JSON_BASE64."; exit 1; }
          printf '%s' "$ADMIN_FIREBASE_JSON_BASE64" | base64 --decode > admin/google-services.json
          python3 - <<'PY'
          import json
          import os
          import xml.sax.saxutils as xml
          with open("admin/google-services.json", encoding="utf-8") as f:
              data = json.load(f)
          package = "com.omni.adminpanel"
          clients = [c for c in data.get("client", [])
                     if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == package]
          if not clients:
              raise SystemExit(f"Firebase config no contiene el paquete {package}")
          client = clients[0]
          project = data["project_info"]
          values = {
              "google_app_id": client["client_info"]["mobilesdk_app_id"],
              "google_api_key": client["api_key"][0]["current_key"],
              "project_id": project["project_id"],
              "gcm_defaultSenderId": project["project_number"],
              "google_storage_bucket": project.get("storage_bucket", ""),
          }
          web_client = next(
              (oauth["client_id"] for item in data["client"] for oauth in item.get("oauth_client", [])
               if oauth.get("client_type") == 3), None)
          if web_client:
              values["default_web_client_id"] = web_client
          os.makedirs("admin/src/main/res/values", exist_ok=True)
          with open("admin/src/main/res/values/firebase_config.xml", "w", encoding="utf-8") as f:
              f.write("<resources>\n")
              for key, value in values.items():
                  f.write(f'  <string name="{key}" translatable="false">{xml.escape(value)}</string>\n')
              f.write("</resources>\n")
          print("Configuración Firebase OMNI Admin validada.")
          PY

      - name: Restore and verify shared persistent OMNI signing identity
        env:
          OMNI_DEBUG_KEYSTORE_BASE64: ${{ secrets.OMNI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$OMNI_DEBUG_KEYSTORE_BASE64" || { echo "::error::Falta OMNI_DEBUG_KEYSTORE_BASE64; se cancela para no cambiar la firma de la app instalada."; exit 1; }
          printf '%s' "$OMNI_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          EXPECTED_SHA256="486513DCA524F8C09134DB97A7D5650A2F2461E4306DB181B7C2DFE2D40E495B"
          ACTUAL_SHA256="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':')"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || { echo "::error::La clave no coincide con la firma persistente autorizada."; exit 1; }
          echo "Firma persistente OMNI validada."

      - name: Set upgrade-safe version code
        run: echo "OMNI_ADMIN_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build OMNI Admin APK
        run: gradle :admin:assembleDebug --no-daemon

      - name: Verify package, version and signing certificate
        run: |
          APK="admin/build/outputs/apk/debug/admin-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "name='com.omni.adminpanel' versionCode='$OMNI_ADMIN_VERSION_CODE'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > /tmp/admin-certs.txt
          APK_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' /tmp/admin-certs.txt | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$APK_SHA256" = "486513DCA524F8C09134DB97A7D5650A2F2461E4306DB181B7C2DFE2D40E495B" || { cat /tmp/admin-certs.txt; exit 1; }
          echo "APK OMNI Admin verificada: paquete, versión y firma."

      - name: Publish OMNI Admin APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMNI-Admin-APK
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
          retention-days: 90
