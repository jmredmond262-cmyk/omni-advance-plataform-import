name: Deploy isolated OMNI DEMO Worker

on:
  workflow_dispatch:
  push:
    branches:
      - feat/omni-demo-online-isolated-complete

permissions:
  contents: read

jobs:
  deploy-demo-worker:
    name: Deploy only the isolated DEMO Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Validate DEMO-only configuration and secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMO_PROJECT_ID: ${{ vars.OMNI_DEMO_FIREBASE_PROJECT_ID }}
          DEMO_SERVICE_ACCOUNT: ${{ secrets.OMNI_DEMO_FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$DEMO_SERVICE_ACCOUNT" || { echo "::error::Falta OMNI_DEMO_FIREBASE_SERVICE_ACCOUNT_BASE64"; exit 1; }
          [[ "$DEMO_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo "::error::OMNI_DEMO_FIREBASE_PROJECT_ID no es válido"; exit 1; }
          test "$DEMO_PROJECT_ID" != "omni-57f69" || { echo "::error::El Worker DEMO no puede usar Firebase de producción"; exit 1; }
          grep -q 'OMNI_ENVIRONMENT = "DEMO"' workers/wrangler.demo.toml
          sed -i "s/REPLACE_WITH_NEW_FIREBASE_DEMO_PROJECT_ID/$DEMO_PROJECT_ID/" workers/wrangler.demo.toml
          grep -q "OMNI_FIREBASE_PROJECT_ID = \"$DEMO_PROJECT_ID\"" workers/wrangler.demo.toml
          printf '%s' "$DEMO_SERVICE_ACCOUNT" | base64 --decode > "$RUNNER_TEMP/omni-demo-service-account.json"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "omni-demo-service-account.json"), encoding="utf-8") as f:
              account = json.load(f)
          if account.get("project_id") != os.environ["DEMO_PROJECT_ID"]:
              raise SystemExit("La cuenta de servicio no pertenece al Firebase DEMO configurado.")
          if not account.get("client_email") or not account.get("private_key"):
              raise SystemExit("La cuenta de servicio DEMO está incompleta.")
          PY
          rm -f "$RUNNER_TEMP/omni-demo-service-account.json"
          echo "Configuración DEMO y pertenencia de la cuenta de servicio validadas."

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy dedicated DEMO Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config workers/wrangler.demo.toml

      - name: Set DEMO-only Firebase service credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERVICE_ACCOUNT_BASE64: ${{ secrets.OMNI_DEMO_FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_BASE64" | base64 --decode | wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON --name omni-demo-api --config workers/wrangler.demo.toml
