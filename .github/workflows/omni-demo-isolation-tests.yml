name: OMNI DEMO Worker isolation tests

on:
  push:
    branches:
      - feat/omni-demo-online-isolated-complete
  pull_request:
    branches:
      - main
    paths:
      - "workers/**"
      - ".github/workflows/omni-demo-isolation-tests.yml"

permissions:
  contents: read

jobs:
  worker-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Worker syntax
        run: npm --prefix workers run check
      - name: Validate DEMO workflow YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path); puts "Valid YAML: #{path}" }' .github/workflows/deploy-omni-demo-worker.yml .github/workflows/build-omni-demo-apks.yml
      - name: Run complete Worker test suite
        run: npm --prefix workers test
